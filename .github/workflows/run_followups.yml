name: Run Follow-ups

on:
  schedule:
    - cron: "0 16 * * *"  # 19:00 EEST (UTC+3)
  workflow_dispatch:

jobs:
  followups:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '{"gmail_password": "${{ secrets.GMAIL_PASSWORD }}"}' > saved_config.json

      - name: Run follow-ups
        run: python run_followups.py
