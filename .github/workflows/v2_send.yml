name: v2 Send Approved

# Sends only rows marked APPROVED in the review queue, plus follow-ups that are due.
# Not on GitHub cron (it ran 9 hours late). Started by hand when the owner asks
# to send approved emails, and at 15:00 Lagos weekdays by the laptop task
# "Maps Leads v2 - 3pm follow-ups" with followups_only=true.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, send nothing"
        type: boolean
        default: true
      followups_only:
        description: "Send due follow-ups only, not new APPROVED emails"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install gspread google-auth
      - name: Write credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      - name: Send
        env:
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
        run: python -m v2.send ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.followups_only && '--followups-only' || '' }}
